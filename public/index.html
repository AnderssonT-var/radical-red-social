<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RADICAL CLUB</title>
<meta name="description" content="RADICAL · la comunidad privada de tu gimnasio">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RADICAL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-route="">
<div id="splash" class="splash"><img class="splash-logo" src="/img/logo-stack.svg" alt="RADICAL CLUB"><div class="splash-bar"><i></i></div></div>

<div id="app" class="app">
  <header class="topbar" id="topbar">
    <a href="#/" class="logo" aria-label="RADICAL CLUB"><img src="/img/logo-h.svg" alt="RADICAL CLUB"></a>
    <div class="top-actions">
      <a href="#/buscar" class="icon-btn" aria-label="Buscar miembros" data-i="search"></a>
      <a href="#/noticias" class="icon-btn" aria-label="Noticias del gimnasio" data-i="megaphone"></a>
      <a href="#/tienda" class="icon-btn" aria-label="Tienda" data-i="bag"></a>
      <a href="#/notificaciones" class="icon-btn has-badge" aria-label="Notificaciones" data-i="bell"><em class="dot" data-badge="notifications"></em></a>
      <a href="#/mensajes" class="icon-btn has-badge" aria-label="Mensajes" data-i="send"><em class="dot" data-badge="messages"></em></a>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>

  <main class="main">
    <div id="view" class="view"></div>
  </main>

  <aside class="right" id="right-col"></aside>

  <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
</div>
<div id="offline" class="offline">Sin conexión</div>
<noscript><p style="color:#fff;padding:24px">RADICAL necesita JavaScript.</p></noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
